{{define "status_partial.html"}}
<div id="status-list" class="space-y-3">
  {{if not .Checks}}
  <div class="panel p-8 text-center text-sm" style="color: var(--ink-dim)">No active checks.</div>
  {{end}}

  {{range .Checks}}
  <div class="panel p-4">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-3">
        <span class="dot {{template "status-dot-class" .Overall}}"></span>
        <span class="font-medium">{{.Check.Name}}</span>
        <div class="flex items-center gap-1 ml-1">
          {{range .Regions}}
          <span class="dot {{if .Stale}}dot-unknown{{else if .Up}}dot-up{{else}}dot-down{{end}}"
                title="{{.Region}}{{if .Stale}} · no data{{else if .Up}} · up{{else}} · down{{end}}"></span>
          {{end}}
        </div>
      </div>
      <span class="text-xs mono" style="color: var(--ink-dim)">{{template "status-label" .Overall}} · {{printf "%.2f" .Uptime30d}}% over 30d</span>
    </div>
    <div class="flex items-center gap-1 overflow-x-auto pb-0.5">
      {{range .DailyBars}}
      <span class="bar {{barColor .}}" title="{{if lt . 0.0}}no data{{else}}{{printf "%.1f" .}}%{{end}}"></span>
      {{end}}
    </div>
  </div>
  {{end}}
</div>
{{end}}
