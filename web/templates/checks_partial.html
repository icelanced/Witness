{{define "checks_partial.html"}}
<div id="checks-list" class="space-y-3">
  {{if not .Checks}}
  <div class="panel p-8 text-center text-sm" style="color: var(--ink-dim)">
    Пока нет ни одной проверки. Добавь первую слева.
  </div>
  {{end}}

  {{range .Checks}}
  <div class="panel p-4">
    <div class="flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0 flex-1">
        <span class="dot {{template "status-dot-class" .Overall}} shrink-0"></span>
        <div class="min-w-0">
          <div class="font-medium truncate">{{.Check.Name}}</div>
          <div class="mono text-xs truncate" style="color: var(--ink-dim)">{{.Check.Target}}</div>
        </div>
      </div>

      <div class="flex items-center gap-4 shrink-0">
        <div class="flex items-center gap-1">
          {{range .Regions}}
          <span class="dot {{if .Stale}}dot-unknown{{else if .Up}}dot-up{{else}}dot-down{{end}}"
                title="{{.Region}}{{if .Stale}} · нет данных{{else if .Up}} · доступен ({{.LatencyMs}}ms){{else}} · недоступен{{end}}"></span>
          {{end}}
        </div>
        <div class="text-right">
          <div class="mono text-sm">{{printf "%.2f" .Uptime24h}}%</div>
          <div class="text-xs" style="color: var(--ink-dim)">24ч</div>
        </div>
        <div class="text-right hidden sm:block">
          <div class="mono text-sm">{{.UpCount}}/{{.Total}}</div>
          <div class="text-xs" style="color: var(--ink-dim)">регионов</div>
        </div>
        <form method="post" action="/admin/checks/{{.Check.ID}}/delete">
          <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}" />
          <button type="submit" class="icon-btn" title="Удалить проверку" aria-label="Удалить">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/>
            </svg>
          </button>
        </form>
      </div>
    </div>

    <div class="flex items-center gap-1 mt-3 overflow-x-auto pb-0.5">
      {{range .DailyBars}}
      <span class="bar shrink-0 {{barColor .}}"></span>
      {{end}}
    </div>
  </div>
  {{end}}
</div>
{{end}}
