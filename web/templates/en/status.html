{{define "status.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Service Status</title>
  {{template "head"}}
</head>
<body class="min-h-screen">
  <div class="max-w-3xl mx-auto px-6 py-14">
    <header class="mb-10">
      <h1 class="text-xl font-semibold">Service Status</h1>
      <p class="text-sm mt-1" style="color: var(--ink-dim)">data from multiple independent regions, updated in real time</p>
    </header>

    <div hx-get="/status/partial" hx-trigger="every 10s" hx-swap="innerHTML">
      {{template "status_partial.html" .}}
    </div>

    <footer class="mt-12 text-xs" style="color: var(--ink-dim)">
      powered by <span class="mono">Witness</span> — self-hosted multi-region monitoring
    </footer>
  </div>
</body>
</html>
{{end}}
